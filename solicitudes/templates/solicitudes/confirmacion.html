<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud enviada</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #fff4ec, #eef8f4 70%);
            color: #39231d;
        }

        article {
            width: min(560px, calc(100% - 32px));
            padding: 36px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.94);
            text-align: center;
            box-shadow: 0 24px 50px rgba(140, 59, 47, 0.12);
        }

        a {
            display: inline-block;
            margin-top: 18px;
            color: #8c3b2f;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <article>
        <h1>Solicitud registrada</h1>
        <p>La solicitud fue enviada y quedó almacenada correctamente.</p>
        <a href="{% url 'solicitudes:formulario' %}">Crear otra solicitud</a>
    </article>
</body>
</html>
