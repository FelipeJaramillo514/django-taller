<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Taller de formularios{% endblock %}</title>
    <style>
        :root {
            --crema: #f6f1e8;
            --marfil: #fffdf8;
            --tinta: #1f2a37;
            --azul: #255c99;
            --azul-oscuro: #16324f;
            --terracota: #9f4a34;
            --borde: #d8cec0;
            --exito: #2e7d32;
            --error: #b3261e;
            --sombra: 0 20px 60px rgba(22, 50, 79, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--tinta);
            background:
                radial-gradient(circle at top left, rgba(37, 92, 153, 0.16), transparent 30%),
                radial-gradient(circle at bottom right, rgba(159, 74, 52, 0.14), transparent 26%),
                linear-gradient(180deg, #fbf6ef 0%, #f0f4f8 100%);
        }

        a {
            color: inherit;
        }

        .shell {
            width: min(1080px, calc(100% - 32px));
            margin: 0 auto;
        }

        .topbar {
            padding: 24px 0 16px;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 18px;
            border: 1px solid rgba(216, 206, 192, 0.8);
            border-radius: 18px;
            background: rgba(255, 253, 248, 0.85);
            backdrop-filter: blur(10px);
            box-shadow: var(--sombra);
        }

        .brand {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.4rem;
            letter-spacing: 0.03em;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-link {
            padding: 10px 14px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            background: rgba(37, 92, 153, 0.08);
        }

        main {
            padding: 10px 0 42px;
        }

        .card {
            background: rgba(255, 253, 248, 0.94);
            border: 1px solid rgba(216, 206, 192, 0.95);
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--sombra);
        }

        .page-header {
            margin-bottom: 24px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(37, 92, 153, 0.08);
            color: var(--azul-oscuro);
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 3vw, 3rem);
            line-height: 1.05;
        }

        p {
            margin: 0;
            line-height: 1.6;
        }

        .hero-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            margin-top: 26px;
        }

        .hero-card {
            padding: 24px;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(241, 246, 251, 0.96));
            border: 1px solid rgba(216, 206, 192, 0.8);
        }

        .hero-card h2 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.25rem;
        }

        .hero-card a {
            display: inline-block;
            margin-top: 16px;
            text-decoration: none;
            font-weight: 700;
        }

        form {
            display: grid;
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--borde);
            font: inherit;
            background: #fff;
        }

        textarea {
            resize: vertical;
        }

        input[type="checkbox"] {
            width: auto;
            padding: 0;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 4px;
        }

        .checkbox-row label {
            margin: 0;
        }

        .errorlist {
            margin: 8px 0 0;
            padding-left: 18px;
            color: var(--error);
        }

        .helptext {
            margin-top: 6px;
            font-size: 0.92rem;
            color: #625957;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 999px;
            padding: 12px 22px;
            background: var(--azul);
            color: #fff;
            text-decoration: none;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .button.secondary {
            background: var(--terracota);
        }

        .confirmation {
            text-align: center;
        }

        .confirmation p {
            margin-top: 12px;
        }

        .confirmation .button {
            margin-top: 22px;
        }

        @media (max-width: 640px) {
            .shell {
                width: min(100%, calc(100% - 20px));
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="shell">
            <div class="nav">
                <p class="brand">Taller de Formularios</p>
                <nav class="nav-links">
                    <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
                    <a class="nav-link" href="{% url 'asistencia:registro' %}">Asistencia</a>
                    <a class="nav-link" href="{% url 'solicitudes:formulario' %}">Solicitudes</a>
                    <a class="nav-link" href="/admin/">Admin</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
