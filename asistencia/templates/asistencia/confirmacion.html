<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia registrada</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #f2fbf3, #e7eefb 65%);
            color: #183b1f;
        }

        article {
            width: min(560px, calc(100% - 32px));
            padding: 36px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.92);
            text-align: center;
            box-shadow: 0 24px 50px rgba(36, 92, 56, 0.12);
        }

        a {
            display: inline-block;
            margin-top: 18px;
            color: #235789;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <article>
        <h1>Registro exitoso</h1>
        <p>La asistencia fue almacenada correctamente en la base de datos.</p>
        <a href="{% url 'asistencia:registro' %}">Registrar otra asistencia</a>
    </article>
</body>
</html>
